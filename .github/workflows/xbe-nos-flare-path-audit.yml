name: Xbox NOS Flare Path Audit

# Read-only XBE audit: no game code or runtime assets are patched.
# Disassembles Pustaka nosfx renderer and traces XBE flare path and loader.
on:
  workflow_dispatch:
  push:
    branches:
      - research/nos-flare-xbe-path
    paths:
      - .github/workflows/xbe-nos-flare-path-audit.yml
      - tools/xbe_rendering_census.py
      - tools/xbe_contrail_xrefs.py
      - tools/pustaka_nosfx_audit.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/nos-flare-xbe-path
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install x86 disassembler
        run: python -m pip install --disable-pip-version-check capstone
      - name: Disassemble Xbox car-render and D3D paths
        run: |
          test -s default.xbe
          python tools/xbe_rendering_census.py
          python tools/xbe_contrail_xrefs.py default.xbe > xbe-contrail-xrefs.txt
          grep -n -E "CarRenderInfo::Render|car render|D3DDevice_Draw|light|flare|CarRenderConn|particle" xbe-rendering-report.txt > xbe-nos-flare-index.txt || true
          curl -L --fail --silent --show-error -o /tmp/pustaka.apk "https://github.com/jimmyaditia10-blip/MostWanted-Android/releases/download/pustaka-apk-source-2026-11-23/MostWanted-1.4.0.apk"
          echo "222da4e42a2c14bba5adf44df1539964b9809a0a4f44c8b688f944503f8d49bc  /tmp/pustaka.apk" | sha256sum -c -
          unzip -p /tmp/pustaka.apk lib/arm64-v8a/libmain.so > /tmp/pustaka-libmain.so
          unzip -p /tmp/pustaka.apk classes.dex > /tmp/pustaka-classes.dex
          {
            echo "Pustaka APK SHA256 verified"
            echo "=== APK entries ==="
            unzip -Z1 /tmp/pustaka.apk | grep -Ei 'texture|mod|dds|pack|manifest|libmain|classes' || true
            echo "=== Native texture/render strings ==="
            strings -a /tmp/pustaka-libmain.so | grep -Ei 'TextureInfo|GetTextureInfo|TexturePack|TextureMapping|TextureManager|TextureCache|texturemappings|\.dds|D3DDevice_SetTexture|eRenderLightFlare|DrawNosTrail|nosfx' | sort -u || true
            echo "=== DEX texture/mod-loader strings ==="
            strings -a /tmp/pustaka-classes.dex | grep -Ei 'TextureInfo|GetTextureInfo|TexturePack|TextureMapping|TextureManager|TextureCache|texturemappings|\.dds|ModTransaction|CarScript|ModsActivity' | sort -u || true
          } > pustaka-texture-api.txt
          curl -L --fail --silent --show-error -o /tmp/jadx.zip "https://github.com/skylot/jadx/releases/download/v1.5.7/jadx-1.5.7.zip"
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          /tmp/jadx/bin/jadx --no-res -d /tmp/pustaka-decompiled /tmp/pustaka.apk >/tmp/jadx.log 2>&1
          {
            echo "=== TexturePacks.java ==="
            sed -n '1,320p' /tmp/pustaka-decompiled/sources/com/racas/mostwanted/TexturePacks.java
            echo "=== TexturePacks related call sites ==="
            grep -RniE 'textureMappings|texturepackinfo|isTexturePack|TexturePacks|neon65\.dds' /tmp/pustaka-decompiled/sources/com/racas/mostwanted | head -200
          } > pustaka-texture-loader-source.txt
          python -m pip install --disable-pip-version-check pyelftools
          python tools/pustaka_nosfx_audit.py /tmp/pustaka-libmain.so > pustaka-nosfx-disasm.txt
      - uses: actions/upload-artifact@v5
        with:
          name: xbox-nos-flare-path-audit
          path: |
            xbe-rendering-report.txt
            xbe-nos-flare-index.txt
            xbe-contrail-xrefs.txt
            pustaka-texture-api.txt
            pustaka-texture-loader-source.txt
            pustaka-nosfx-disasm.txt
          if-no-files-found: error
          retention-days: 14
