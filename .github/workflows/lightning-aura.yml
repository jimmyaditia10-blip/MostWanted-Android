name: Lightning Aura Build

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Nama artifact build (opsional)"
        required: false
        default: "lightning-aura"
  push:
    branches:
      - feature/lightning-mcqueen-aura
    paths:
      - "app/**"
      - "assets/**"
      - "ci/default.xbe.enc"
      - "build.bat"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - ".github/workflows/lightning-aura.yml"

permissions:
  contents: read

concurrency:
  group: lightning-aura-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Lightning Aura APK
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK packages
        shell: cmd
        run: call "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platforms;android-34" "ndk;%NDK_VERSION%" "cmake;%CMAKE_VERSION%" >nul

      - name: Restore and verify default.xbe
        shell: bash
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          set -euo pipefail
          test -n "$XBE_KEY" || { echo "::error::XBE_KEY secret is missing"; exit 1; }
          test -f ci/default.xbe.enc || { echo "::error::ci/default.xbe.enc is missing"; exit 1; }
          mkdir -p assets
          key="$RUNNER_TEMP/xbe.key"
          printf '%s' "$XBE_KEY" | tr -d '\r\n' > "$key"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key"
          rm -f "$key"
          actual="$(sha1sum assets/default.xbe | cut -d' ' -f1)"
          echo "default.xbe SHA-1: $actual"
          test "$actual" = "f636a16af04171089f879a4bed646e185c734233" || { echo "::error::Unexpected default.xbe image"; exit 1; }

      - name: Build APK
        shell: cmd
        run: call build.bat

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk" || { echo "::error::Release APK was not produced"; exit 1; }
          sha256sum "$apk" | tee apk-sha256.txt
          ls -lh "$apk"

      - name: Upload APK and verification report
        uses: actions/upload-artifact@v5
        with:
          name: ${{ github.event.inputs.build_name || 'lightning-aura' }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
